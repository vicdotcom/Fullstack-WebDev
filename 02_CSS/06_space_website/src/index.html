<!DOCTYPE html>

<html lang="en"> 
    <!-- English HTML language code -->
    <!-- Useful for accessibility and ensures the website reachers the right audience -->
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>SpaceBalls.com</title>

        <!-- Google font family -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="hero">
            <img src="../images/logo.png" alt="SpaceBalls logo" id="img-logo">

            <h1 id="hero-text">Join the <span class="explore">exploration</span></h1>
            <!-- Span allows us to perform inline editing to elements -->
            <!-- Here we cant use div since it is a block-based function (i.e.- It would isolate the text in the paragraph) -->

            <a href="https://www.spacex.com/careers" class="button-apply">Apply!</a>
        </div>

        <div class="terms-conditions">
            <h2><a href="" target="_blank">Terms and conditions</a> apply</h2>
        </div>

    </body>
</html>
