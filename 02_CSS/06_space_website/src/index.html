<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>SpaceBalls.com</title>

        <!-- Google font family -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="landing">
            <img src="../images/logo.png" alt="SpaceBalls logo" id="img-logo">

            <h1>Join the <span class="explore">exploration</span></h1>
            <!-- Span allows us to perform inline editing to elements -->
            <!-- Here we cant use div since it is a block-based function (i.e.- It would isolate the text in the paragraph) -->

            <button class="button-apply">Apply!</button>
        </div>

        <div class="terms-conditions">
            <h2>Terms and conditions apply</h2>
        </div>

    </body>
</html>
