<!-- HTML Lists -->
<!-- Say we want to create a list of the countries that won the most medal in the most recent Olympics -->

<!doctype html>
<html>
    <head></head>

    <body>
        <h1>2024 Summer Olympics</h1>
        <p>List of countries with the most gold medal wins at the 2024 Summer Olympics</p>
        <ol> <!-- ordered list wrapper tag --> <!-- <ul> for unordered lists -->
            <li>United States</li>  <!-- <li> for each item -->
            <li>China</li>
            <li>Great Britain</li>
            <li>France</li>
            <li>Australia</li>
            <li>Japan</li>
            <li>Italy</li>
            <li>Netherlands</li>
            <li>South Korea</li>
            <li>Germany</li>
            <!-- Later on, we can be able to style the lists using CSS -->

        </ol>
    </body>


</html>
