<!-- html basic documnent structure -->

<!doctype html> <!-- Metadata for telling the browser that the page should be rendered in html -->
<!-- The entire html body. Anything under here should be rendered in hrml by a browser-->
<html> 
    <!-- head group which contains information about the page -->
    <head>
        <link rel="stylesheet" href="https://raw.githubusercontent.com/scrimba/learn-fullstack-development/refs/heads/main/02.%20HTML%20and%20CSS%20Fundamentals/01.%20Intro%20to%20HTML/08.%20Let_s%20build%20Google/styles.css"> 
          <!-- CSS Styling to apply to the page -->
          <!-- <link> does not always mean CSS however. It could also be used for other resources such as website icons depending on the defined relationship (rel=) -->
        <title>Google.com</title> <!-- This is what will appear on the address bar (Will be implemnted later) -->
    </head>

    <!-- body group that contains what visitors actually see -->
    <body>
        <div style="text-align: center">  
            <!-- div block allows to group html elements together to specify formatting on all of them at a go, or for organisation-->
            <!-- Wil be more common in CSS -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSo-D0-cTlzM8X__f505EwRQp3bwFfVETXisSDFLVepsg&s=10" alt="Google Image" width="30%">

            <br><br><input type="search" class="search-bar" size="40">
            
            <br><br>
            <button>Google Search</button> 
            <button> I'm feeling lucky</button>
            <p>We respect your privacy. 
                <a href="blog.html" target="_blank"> Learn how</a></p>
        </div>
    </body>
</html>
